spring:
  application:
    name: places-been
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Existing databases (Supabase) already have the V1 tables: record them as version 1 instead of failing
    baseline-on-migrate: true
  mvc:
    apiversion:
      supported: 1
      default: 1
      use:
        header: Api-Version
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: ERROR
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
