spring:
  application:
    name: places-been
  datasource:
    url: { DB_URL:jdbc:postgresql://localhost:5433/places_been_db }
    username: { DB_USER:admin }
    password: { DB_PASSWORD:admin }
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    apiversion:
      supported: 1
      default: 1
      enabledd: true
      use:
        header: Api-Version