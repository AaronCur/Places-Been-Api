# Render's free plan sleeps the API after 15 minutes without requests, and waking it takes 1-2 minutes
# (container start + Spring Boot). Pinging the health endpoint every 10 minutes keeps it awake; one always-on
# service (~730 h/month) fits in the free plan's 750 instance hours.
# The health check also queries the database, so the free Supabase project never idles long enough to pause.
#
# Scheduled runs only fire from the default branch, can start a few minutes late, and GitHub disables them
# after 60 days without repository activity (re-enable from the Actions tab).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        # --max-time covers a cold start if a ping was skipped; --retry rides out a single bad response
        run: >
          curl --fail --silent --show-error
          --max-time 180 --retry 2 --retry-delay 10 --retry-all-errors
          https://places-been-api.onrender.com/actuator/health
