# Weekly update PRs: one per ecosystem (Maven, Docker, GitHub Actions).
# If a grouped PR goes red, the failing package is usually a major bump; drop it with
# `@dependabot ignore <package> major version` and the PR rebuilds without it.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
